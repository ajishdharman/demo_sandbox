# Push Code
#    │
#    ▼
# SAST (Semgrep)
#    │
#    ▼
# Build
#    │
#    ▼
# Deploy (Render)
#    │
#    ▼
# Trigger Playwright Tests
#    │
#    ▼
# DAST
#    ├── OWASP ZAP
#    └── Nuclei

name: Build Deploy Trigger Tests

on:
  push:
    branches:
      - main

jobs:

  sast-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run SAST Scan
        run: |
          semgrep --config=auto \
          --json \
          --output semgrep-report.json || true

      - name: Generate HTML report
        run: |
          echo "<html><body><h1>SAST Report</h1><pre>" > semgrep-report.html
          cat semgrep-report.json >> semgrep-report.html
          echo "</pre></body></html>" >> semgrep-report.html

      - name: Fail pipeline if HIGH/CRITICAL found
        run: |
          if grep -E '"severity":"(ERROR|HIGH|CRITICAL)"' semgrep-report.json; then
            echo "High severity vulnerabilities detected!"
            exit 1
          else
            echo "No critical vulnerabilities."
          fi

      - name: Upload SAST Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-security-report
          path: |
            semgrep-report.json
            semgrep-report.html


  build:
    needs: sast-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: echo "Unit tests passed"


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Wait for application to become live
        run: |
          echo "Waiting for deployment..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://demo-sandbox-gmqg.onrender.com)
            if [ "$STATUS" -eq 200 ]; then
              echo "Application is live!"
              exit 0
            fi
            echo "Not ready yet... retrying in 10 seconds"
            sleep 10
          done
          echo "Deployment timeout"
          exit 1


  trigger-tests:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Playwright tests
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.PLAYWRIGHT_TRIGGER_TOKEN }}" \
          -H "Content-Type: application/json" \
          https://api.github.com/repos/ajishdharman/demo_playwright/dispatches \
          -d '{"event_type":"run-playwright-tests"}'

      - name: Confirm dispatch
        run: echo "Playwright test trigger sent"


  security-scan:
    needs: trigger-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix workspace permissions
        run: chmod -R 777 $GITHUB_WORKSPACE


      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        continue-on-error: true
        with:
          target: 'https://demo-sandbox-gmqg.onrender.com'
          allow_issue_writing: false
          artifact_name: 'false'


      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-report
          path: |
            report_html.html
            report_json.json
            report_md.md


      - name: Install Nuclei
        run: |
          curl -L https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei-linux-amd64.zip -o nuclei.zip
          unzip nuclei.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -version


      - name: Run Nuclei Scan
        run: |
          nuclei -u https://demo-sandbox-gmqg.onrender.com \
          -severity critical,high,medium \
          -jsonl -o nuclei-report.json


      - name: Upload Nuclei Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-security-report
          path: nuclei-report.json